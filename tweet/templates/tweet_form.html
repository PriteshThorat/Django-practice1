{% extends "layout.html" %}

{% block title %}
Tweet App
{% endblock %}

{% block content %}
    <h1>Welcome to Twitter App</h1>
    <h2>
        {% if form.instance.pk %}
        Edit Tweet
        {% else %}
        Create Tweet
        {% endif %}
    </h2>
    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        {{form.as_p}}
        <button type="submit">Submit</button>
    </form>
    <a href="{% url "tweet_list" %}">Back to tweet list</a>
{% endblock %}
